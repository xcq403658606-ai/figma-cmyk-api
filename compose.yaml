services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-4}
      MALLOC_ARENA_MAX: ${MALLOC_ARENA_MAX:-2}
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 6g

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      EDC_API_DOMAIN: ${EDC_API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
